
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAIRON OS - Swiss AI Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      window.global = window;
      window.process = { 
        env: { NODE_ENV: 'development' },
        browser: true,
        version: '',
        nextTick: (cb) => setTimeout(cb, 0)
      };
    </script>
    <style>
      :root {
        --vairon-indigo: #6366f1;
        --vairon-rose: #f43f5e;
        --vairon-slate-950: #020617;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--vairon-slate-950);
        color: #e2e8f0;
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* ENHANCED MARKDOWN STYLING FOR BATTLECARDS */
      .prose {
        color: #cbd5e1;
        max-width: none;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .prose strong {
        color: #ffffff;
        font-weight: 800;
      }
      .prose h1, .prose h2, .prose h3 {
        color: #f8fafc;
        font-weight: 900;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        letter-spacing: -0.025em;
        text-transform: uppercase;
      }
      .prose h2 { 
        font-size: 1.15rem; 
        border-left: 4px solid var(--vairon-indigo); 
        padding-left: 1rem;
        background: rgba(99, 102, 241, 0.05);
        margin-top: 2rem;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
      }
      .prose p { margin-bottom: 1rem; }
      .prose ul { list-style-type: none; padding-left: 0; margin-bottom: 1.5rem; }
      .prose ul li { position: relative; padding-left: 1.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 0.25rem; }
      .prose ul li::before {
        content: "→";
        position: absolute;
        left: 0;
        color: var(--vairon-indigo);
        font-weight: bold;
      }
      
      /* RESPONSIVE TABLES IN MARKDOWN */
      .prose table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 12px;
        overflow: hidden;
        font-size: 0.85rem;
      }
      .prose th {
        background: rgba(99, 102, 241, 0.1);
        color: white;
        text-align: left;
        padding: 12px;
        border-bottom: 2px solid rgba(99, 102, 241, 0.2);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .prose td {
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        color: #94a3b8;
      }
      .prose tr:last-child td { border-bottom: none; }
      .prose tr:hover td { background: rgba(255,255,255,0.02); color: white; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@^5.4.449",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.1",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react-swc": "https://esm.sh/@vitejs/plugin-react-swc@^4.2.2",
    "vite-plugin-top-level-await": "https://esm.sh/vite-plugin-top-level-await@^1.6.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
